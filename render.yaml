previews:
  generation: off

projects:
  - name: Open Vote Launch
    environments:
      - name: production
        services:
          - type: web
            name: openvote-launch
            runtime: docker
            plan: 0.5c-512mb
            region: frankfurt
            autoDeployTrigger: checksPass
            dockerfilePath: ./infra/demand.Dockerfile
            dockerContext: .
            healthCheckPath: /health
            domains:
              - openvote.com.ua
            envVars:
              - key: OPENVOTE_ENVIRONMENT
                value: demand
              - key: OPENVOTE_PUBLIC_ORIGIN
                value: https://openvote.com.ua
              - key: DEMAND_DATABASE_URL
                fromDatabase:
                  name: openvote-demand
                  property: connectionString
        databases:
          - name: openvote-demand
            databaseName: openvote_demand
            user: openvote_demand
            plan: 0.1c-256mb
            diskSizeGB: 1
            postgresMajorVersion: "18"
            region: frankfurt
            ipAllowList: []
